spring.application.name=anti-impulse-assistant
server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/anti_impulse_assistant?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false
server.error.include-message=always
app.jwt.secret=${JWT_SECRET:MindfulCartJwtSecretKeyForDevelopmentOnlyChangeBeforeProduction123456789}
app.jwt.expiration-ms=86400000
app.cors.allowed-origin=${FRONTEND_URL:http://localhost:3000}
app.ai.api-key=${OPENAI_API_KEY:}
app.ai.model=${OPENAI_MODEL:gpt-4.1-mini}
app.ocr.language=${OCR_LANGUAGE:eng}
app.ocr.page-segmentation-mode=${OCR_PAGE_SEGMENTATION_MODE:6}
