spring.application.name=anti-impulse-assistant
server.port=${PORT:8080}
server.address=0.0.0.0
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nava?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false
server.error.include-message=always
app.jwt.secret=${JWT_SECRET:MindfulCartJwtSecretKeyForDevelopmentOnlyChangeBeforeProduction123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:3000}
app.ocr.language=${OCR_LANGUAGE:eng}
app.ocr.page-segmentation-mode=${OCR_PAGE_SEGMENTATION_MODE:6}
