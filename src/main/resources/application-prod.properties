# Render runtime
server.port=${PORT:10000}
server.address=0.0.0.0
server.forward-headers-strategy=framework
server.shutdown=graceful
server.compression.enabled=true

# Aiven MySQL. Secrets are provided only through Render environment variables.
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:nava}?sslMode=REQUIRED&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.max-lifetime=600000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Production security
app.jwt.secret=${JWT_SECRET}
app.cors.allowed-origins=${FRONTEND_URL}
app.cors.allowed-origin-patterns=${FRONTEND_ORIGIN_PATTERNS:https://*.vercel.app}

# Keep deployment logs useful without exposing SQL values.
debug=false
logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=WARN
